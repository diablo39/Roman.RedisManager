version: "3.8"

services:
  redis-master:
    image: redis:7.2
    container_name: redis-master
    command: ["redis-server", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - redis-master-data:/data
    networks:
      - redis-net

  redis-slave-1:
    image: redis:7.2
    container_name: redis-slave-1
    depends_on:
      - redis-master
    command: ["redis-server", "--port", "8001", "--replicaof", "redis-master", "8000"]
    ports:
      - "8001:8001"
    volumes:
      - redis-slave-1-data:/data
    networks:
      - redis-net

  redis-cluster-7000:
    image: redis:7.2
    container_name: redis-cluster-7000
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7000.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - redis-cluster-7000-data:/data
    networks:
      - redis-net

  redis-cluster-7001:
    image: redis:7.2
    container_name: redis-cluster-7001
    command: ["redis-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7001.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis-cluster-7001-data:/data
    networks:
      - redis-net

  redis-cluster-7002:
    image: redis:7.2
    container_name: redis-cluster-7002
    command: ["redis-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7002.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis-cluster-7002-data:/data
    networks:
      - redis-net

  redis-cluster-init:
    image: redis:7.2
    container_name: redis-cluster-init
    depends_on:
      - redis-cluster-7000
      - redis-cluster-7001
      - redis-cluster-7002
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "sleep 2; \
      echo 'Creating redis cluster...'; \
      redis-cli --cluster create redis-cluster-7000:7000 redis-cluster-7001:7001 redis-cluster-7002:7002 --cluster-replicas 0 --cluster-yes || true; \
      echo 'Cluster init finished';"
    networks:
      - redis-net

networks:
  redis-net:

volumes:
  redis-master-data:
  redis-slave-1-data:
  redis-cluster-7000-data:
  redis-cluster-7001-data:
  redis-cluster-7002-data:
