version: "3.8"

services:
  redis-master:
    image: redis:7.2
    container_name: redis-master
    network_mode: "host"
    command: ["redis-server", "--port", "8000"]
    volumes:
      - redis-master-data:/data
    # ports not needed with host network
    # volumes and others remain
    # networks removed

  redis-slave-1:
    image: redis:7.2
    container_name: redis-slave-1
    network_mode: "host"
    depends_on:
      - redis-master
    command: ["redis-server", "--port", "8001", "--replicaof", "127.0.0.1", "8000"]
    volumes:
      - redis-slave-1-data:/data
    # ports not needed with host network
    # networks removed

  redis-cluster-7000:
    image: redis:7.2
    container_name: redis-cluster-7000
    network_mode: "host"
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7000.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis-cluster-7000-data:/data

  redis-cluster-7001:
    image: redis:7.2
    container_name: redis-cluster-7001
    network_mode: "host"
    command: ["redis-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7001.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis-cluster-7001-data:/data

  redis-cluster-7002:
    image: redis:7.2
    container_name: redis-cluster-7002
    network_mode: "host"
    command: ["redis-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes-7002.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    volumes:
      - redis-cluster-7002-data:/data

  redis-cluster-init:
    image: redis:7.2
    container_name: redis-cluster-init
    network_mode: "host"
    depends_on:
      - redis-cluster-7000
      - redis-cluster-7001
      - redis-cluster-7002
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "sleep 2; \
      echo 'Creating redis cluster...'; \
      redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes || true; \
      echo 'Cluster init finished';"


volumes:
  redis-master-data:
  redis-slave-1-data:
  redis-cluster-7000-data:
  redis-cluster-7001-data:
  redis-cluster-7002-data:
