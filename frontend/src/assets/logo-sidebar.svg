<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 10 104 104" width="128" height="128">
  <defs>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Database cylinder -->
  <ellipse cx="64" cy="28" rx="46" ry="14" fill="url(#cyl)" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M18 28 v68 a46 14 0 0 0 92 0 V28" fill="url(#cyl)" stroke="#94A3B8" stroke-width="1.5"/>
  <ellipse cx="64" cy="96" rx="46" ry="14" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Disc partitions -->
  <path d="M18 50 a46 14 0 0 0 92 0" fill="none" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M18 72 a46 14 0 0 0 92 0" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Roman arch -->
  <path d="M40 98 V52 a24 24 0 0 1 48 0 V98"
        fill="none" stroke="url(#arch)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arch inner echo -->
  <path d="M44 98 V54 a20 20 0 0 1 40 0 V98"
        fill="none" stroke="#EF4444" stroke-width="0.75" opacity="0.2"/>

  <!-- Keystone -->
  <rect x="59" y="29" width="10" height="7" rx="2" fill="#DC2626"/>

  <!-- Small column bases -->
  <rect x="37" y="90" width="7" height="12" rx="1" fill="#94A3B8" opacity="0.4"/>
  <rect x="84" y="90" width="7" height="12" rx="1" fill="#94A3B8" opacity="0.4"/>

  <!-- R letter -->
  <text x="64" y="88" text-anchor="middle"
        font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-weight="800" font-size="42" fill="#1E293B"
        letter-spacing="-1">R</text>

  <!-- Data nodes -->
  <circle cx="50" cy="60" r="2.5" fill="#EF4444" opacity="0.5"/>
  <circle cx="78" cy="60" r="2.5" fill="#EF4444" opacity="0.5"/>
  <circle cx="50" cy="78" r="2.5" fill="#EF4444" opacity="0.5"/>
  <circle cx="78" cy="78" r="2.5" fill="#EF4444" opacity="0.5"/>

  <!-- Node connections -->
  <g stroke="#EF4444" stroke-width="0.5" opacity="0.15">
    <line x1="50" y1="60" x2="78" y2="60"/>
    <line x1="50" y1="78" x2="78" y2="78"/>
    <line x1="50" y1="60" x2="50" y2="78"/>
    <line x1="78" y1="60" x2="78" y2="78"/>
  </g>
</svg>
