<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 3 28 26" width="32" height="32">
  <defs>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Database cylinder outline -->
  <ellipse cx="16" cy="8" rx="12" ry="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <path d="M4 8 v16 a12 4 0 0 0 24 0 V8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <ellipse cx="16" cy="24" rx="12" ry="4" fill="none" stroke="#94A3B8" stroke-width="1"/>

  <!-- Disc partition -->
